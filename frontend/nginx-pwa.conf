# Service statique de la PWA Zümm (SPRINT-13).
#
# Ce nginx-la ne fait PAS la terminaison TLS ni les en-tetes de securite : c'est
# le proxy inverse de `infra/nginx/nginx.conf` qui les porte, en un seul endroit.
# Ici, deux responsabilites seulement : le repli SPA et la politique de cache.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Bundles hashes par Vite : le nom change a chaque contenu, donc le cache peut
    # etre immuable et long. C'est ce qui rend les rechargements gratuits.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # La coquille et le service worker, eux, ne doivent JAMAIS etre caches par un
    # intermediaire : un index.html perime pointerait vers des bundles disparus —
    # c'est exactement la panne d'ecran blanc que le SPRINT-13 corrige.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }

    # Repli SPA : le routage est cote client (ADR-005), toute route inconnue rend
    # la coquille, qui decide alors quoi afficher — y compris la page « introuvable ».
    location / {
        try_files $uri $uri/ /index.html;
    }
}
