events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Compression : la PWA est utilisee sur le terrain, en 3G et souvent en bord
    # de reseau. Les reponses JSON de l'API et les bundles du client sont les deux
    # postes qui comptent ; les images et les PDF sont deja compresses.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/problem+json application/manifest+json
                      image/svg+xml;

    # Limitation de debit : une API de terrain n'a aucune raison de recevoir
    # des rafales, et les positions de ruchers valent d'etre protegees du
    # moissonnage automatise.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # Zone SEPAREE et bien plus stricte pour l'authentification : c'est la seule
    # surface ou un attaquant gagne quelque chose a repeter (bourrage
    # d'identifiants). La protection anti-force-brute de Keycloak agit par compte ;
    # celle-ci agit par adresse, et couvre donc l'essai d'un mot de passe sur mille
    # comptes differents — que la premiere ne voit pas.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

    # ─── Redirection systematique vers HTTPS ───
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── Terminaison TLS ───
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/zumm.crt;
        ssl_certificate_key /etc/nginx/ssl/zumm.key;

        # US-023 : TLS 1.3 exige par le cahier des charges. On l'impose comme
        # plancher (les navigateurs cibles de la PWA le supportent tous). Les
        # suites 1.3 sont fixees explicitement ; `ssl_ciphers` ne concerne que
        # 1.2 et n'a donc pas d'effet ici, mais reste au cas ou un repli serait
        # reintroduit.
        ssl_protocols       TLSv1.3;
        ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        # ─── Content-Security-Policy (SPRINT-12) ───
        #
        # Tant que les jetons vivent cote navigateur (cf. ADR-006), une XSS vaut un
        # vol de session : la CSP est la seconde ligne, celle qui empeche le script
        # injecte de s'executer ou d'exfiltrer.
        #
        #   default-src 'self'   tout ce qui n'est pas cite ci-dessous reste local ;
        #   script-src  'self'   aucun script inline, aucun CDN — Vite produit des
        #                        bundles hashes servis depuis cette origine ;
        #   style-src   inline   MapLibre pose ses styles de marqueur en ligne ;
        #                        l'interdire casserait la carte sans fermer de voie
        #                        d'execution (une feuille de style n'execute rien) ;
        #   img-src     data:    les apercus de photo hors-ligne sont des data: URL,
        #                        blob: sert aux exports et aux tuiles ;
        #   connect-src          l'API et Keycloak sont sur CETTE origine (le proxy
        #                        les rassemble) ; seules les tuiles OSM sortent ;
        #   frame-ancestors      redondant avec X-Frame-Options, mais c'est la
        #                        directive que les navigateurs recents honorent ;
        #   form-action          empeche un formulaire injecte de poster ailleurs ;
        #   object-src 'none'    plus aucun greffon n'a de raison d'etre.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://tile.openstreetmap.org https://*.tile.openstreetmap.org; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

        # Aucune fonctionnalite du navigateur n'est requise hors geolocalisation
        # (centrage de la carte sur l'agent). Tout le reste est coupe a la source.
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), interest-cohort=()" always;

        # Isole le contexte de navigation : une fenetre ouverte par un tiers ne
        # garde pas de reference sur celle de Zumm (protection contre le tabnabbing
        # inverse et les fuites par `window.opener`).
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Taille des televersements : photos de visite (US-010).
        client_max_body_size 20m;

        # Delais : un client qui ouvre une connexion et n'envoie rien immobilise un
        # worker. Bornes courtes, largement suffisantes pour une API JSON.
        client_body_timeout   15s;
        client_header_timeout 15s;
        send_timeout          30s;

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sonde de vie, sans exposer le reste d'Actuator.
        location = /actuator/health {
            proxy_pass http://backend:8080/actuator/health;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Le reste d'Actuator n'est jamais joignable depuis l'exterieur.
        location /actuator/ {
            return 404;
        }

        # ─── BFF : le flux OIDC est mene par le BACK-END (ADR-006) ───
        #
        # Trois prefixes appartiennent a l'application, pas a la PWA :
        #   /oauth2/  depart de la connexion (redirection vers Keycloak) ;
        #   /login/   retour de Keycloak avec le code d'autorisation ;
        #   /bff/     etat de session et deconnexion.
        #
        # Ils doivent atteindre le back-end AVANT la regle `/`, qui sert le
        # client statique. Le cookie de session voyage sur ces routes : c'est ce
        # qui remplace les jetons dans le navigateur.
        location /oauth2/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /login/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /bff/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── Fournisseur d'identite ───
        # Keycloak sert ses endpoints OIDC sous /realms/ et les ressources de ses
        # pages de connexion sous /resources/. Seuls ces prefixes sont exposes :
        # l'emetteur reste `https://<hote>/realms/zumm`, inchange.
        location /realms/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://keycloak:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /resources/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # La console d'administration Keycloak n'a rien a faire sur Internet : elle
        # s'atteint par le reseau interne ou un tunnel. L'exposer, c'est offrir la
        # prise de controle de TOUTES les identites derriere un seul mot de passe.
        location /admin/ {
            return 404;
        }

        # ─── PWA Zümm ───
        # Le client est servi par son propre conteneur (image statique). Il occupe
        # la racine : c'est l'application, pas la page de connexion.
        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
