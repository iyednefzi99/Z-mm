# ═══════════════════════════════════════════════════════════
# Surcouche de DÉVELOPPEMENT — comptes de test et realm importé
#
# Le docker-compose.yml de base importe le realm de PRODUCTION
# (realm-zumm.json), sans comptes de test. Cette surcouche le remplace par le
# realm de développement (realm-zumm.dev.json), qui embarque quatre comptes de
# test à mot de passe en clair (« test »), un par rôle, tous sur le tenant
# « exploitation-demo » — celui du jeu de données de démonstration (seed-demo.sql).
#
# ⚠️ JAMAIS en production : mots de passe factices et comptes préprovisionnés.
#
# Usage :
#   docker compose --env-file .env \
#     -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d --build
#   bash infra/seed-demo.sh
# ═══════════════════════════════════════════════════════════

services:

  # ── Boite aux lettres de developpement (SPRINT-33) ──────────────────────
  #
  # Mailpit capte TOUT le courrier sortant de la pile et ne le relaie nulle
  # part : aucun message ne peut partir vers une vraie adresse depuis un poste
  # de developpement. C'est ce qui permet de derouler « mot de passe oublie »
  # de bout en bout — et de voir les notifications d'alerte de l'US-041, qui
  # etaient jusqu'ici desactivees faute de serveur d'envoi.
  #
  # Interface : http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: zumm-mailpit
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025"
    networks:
      - zumm-network
  keycloak:
    volumes:
      - ./keycloak/realm-zumm.dev.json:/opt/keycloak/data/import/realm-zumm.json:ro
    environment:
      # Emetteur FIGE. Sans cela, `start-dev` derive le « iss » de l'hote de la
      # requete : un jeton demande par le BFF via `keycloak:8080` en porte un
      # different de celui obtenu par le navigateur via `localhost:8081`, et un
      # validateur unique ne peut pas satisfaire les deux — d'ou les
      # « The iss claim is not valid » sur la connexion applicative.
      KC_HOSTNAME: http://localhost:8081
      # Les appels de service continuent de viser l'hote interne, que l'URL
      # publique figee ci-dessus ne permet pas de joindre depuis le reseau compose.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    depends_on:
      mailpit:
        condition: service_started

  backend:
    # NOMME l'image du back-end de développement. Le `build:` du compose de base
    # reste en place : `docker compose build backend` reconstruit donc bien
    # depuis les sources et republie CE tag. Le nommer sert au cas dégradé —
    # quand le pull de `maven:3.9-eclipse-temurin-17` échoue, `infra/backend-jar.Dockerfile`
    # reconstruit le même tag à partir d'un JAR compilé sur l'hôte, et
    # `demarrer.ps1 -Rapide` le reprend sans rien reconstruire.
    image: zumm-backend:dev
    # Publié sur l'hôte pour que le serveur de dev Vite (proxy /api → :8080)
    # atteigne directement l'API, sans passer par le proxy TLS.
    ports:
      - "8080:8080"
    environment:
      # En dev, l'émetteur des jetons vu par le navigateur est http://localhost:8081,
      # alors que la valeur par défaut du compose de base est l'URL interne
      # (keycloak:8080). On surcharge donc l'« iss » attendu par l'émetteur RÉEL des
      # jetons émis pour le navigateur. Les clés restent récupérées via le JWKS
      # interne (hérité du compose de base). Ne jamais laisser vide : Spring Boot
      # construirait un validateur attendant une chaîne « iss » vide.
      ZUMM_OIDC_ISSUER_URI: http://localhost:8081/realms/zumm
      # Adresse par laquelle le BFF JOINT Keycloak, distincte de l'« iss » ci-dessus.
      # Sans elle, `IdentiteService` reprenait l'issuer — donc http://localhost:8081
      # DEPUIS LE CONTENEUR, qui n'y ecoute rien : la demande de jeton tombait en
      # « connection refused » et l'ecran de connexion affichait « Service
      # momentanement indisponible ». Hors surcharge, le compose de base laisse
      # l'issuer valoir deja l'URL interne et cette variable est inutile.
      ZUMM_OIDC_INTERNE: http://keycloak:8080/realms/zumm
      # Parcours « mot de passe oublie » du fournisseur d'identite. Publiee par
      # `/api/info`, elle fait apparaitre le lien dans `RecuperationVue`. L'URL
      # est celle que voit le NAVIGATEUR, pas l'hote interne.
      ZUMM_AUTH_REINITIALISATION_URL: >-
        http://localhost:8081/realms/zumm/login-actions/reset-credentials?client_id=zumm-frontend
      # Notifications d'alerte (US-041) : elles etaient desactivees par defaut
      # parce que la pile ne dependait d'aucun SMTP. Elle en a un maintenant.
      ZUMM_NOTIF_EMAIL_ENABLED: "true"
      ZUMM_NOTIF_EMAIL_FROM: alertes@zumm.test
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
