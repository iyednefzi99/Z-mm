name: CI applicative

# Ne touche pas build-pdfs.yml : les deux workflows sont independants.
on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'

env:
  JAVA_VERSION: '17'

jobs:
  backend:
    name: Backend — build et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Les tests d'integration ont besoin de cette image ; elle n'est pas
      # publiee sur un registre, donc la CI la construit comme un poste local.
      - name: Construire l'image PostgreSQL de test
        run: docker build -f infra/test-postgres.Dockerfile -t zumm/test-postgres:16 infra/

      - name: Tests unitaires et d'integration
        working-directory: backend
        run: ./mvnw -B verify

      # Un `BUILD SUCCESS` ne prouve rien si les tests d'integration ont ete
      # ignores faute de Docker : on le verifie explicitement.
      - name: Verifier que les tests d'integration ont bien tourne
        working-directory: backend
        run: |
          set -euo pipefail
          fichiers=$(ls target/failsafe-reports/*.txt 2>/dev/null || true)
          if [ -z "$fichiers" ]; then
            echo "::error::Aucun rapport failsafe : les tests d'integration n'ont pas tourne."
            exit 1
          fi
          if grep -qE "Skipped: [1-9]" $fichiers; then
            echo "::error::Des tests d'integration ont ete ignores."
            grep -E "Tests run" $fichiers
            exit 1
          fi
          grep -hE "Tests run" $fichiers

      # Le contrat OpenAPI est REGENERE par `verify` (ContratOpenApiIT). S'il
      # differe de la version committee, c'est que l'API a bouge sans que le
      # contrat suive — et le client TypeScript se retrouve a decrire une API qui
      # n'existe plus. Meme regle que pour les PDF du cahier des charges.
      - name: Verifier que le contrat OpenAPI committe est a jour
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- frontend/src/api/openapi.json; then
            echo "::error::Le contrat OpenAPI committe ne correspond plus a l'API.           Rejouer : cd backend && ./mvnw -B verify -Dit.test=ContratOpenApiIT,           puis cd frontend && npm run api:contrat"
            exit 1
          fi

      - name: Empaqueter le JAR
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: zumm-jar
          path: backend/target/zumm.jar

  frontend:
    name: Frontend — lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        working-directory: frontend
        run: npm ci

      - name: Verification des types
        working-directory: frontend
        run: npm run typecheck

      # US-049 : le front n'avait ni lint ni test avant le SPRINT-10. Les deux
      # etapes precedent le build — un test rouge doit arreter la chaine avant
      # qu'un artefact ne soit produit.
      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      # `parite.ts` verifie a la COMPILATION que les types ecrits a la main
      # decrivent la meme chose que le contrat. Encore faut-il que les types
      # generes soient a jour : on les regenere et on exige l'absence de diff.
      - name: Verifier que les types generes suivent le contrat
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run api:contrat
          if ! git diff --exit-code -- src/api/contrat.ts; then
            echo "::error::Types generes obsoletes : rejouer `npm run api:contrat`."
            exit 1
          fi

      - name: Tests unitaires (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build de production
        working-directory: frontend
        run: npm run build

  securite:
    name: Sécurité — secrets, dépendances, images, licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Recherche de secrets versionnes : aucun secret ne doit entrer dans
      # l'historique, y compris dans un commit ancien.
      - name: Scan de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # ─── Vulnerabilites des dependances Java ───
      #
      # Le scanner ne resout PAS l'arbre lui-meme : Maven l'a deja fait. On lui
      # donne un SBOM CycloneDX, c'est-a-dire la liste des artefacts REELLEMENT
      # resolus. Ce detail est tout le sujet : laisser OSV reconstituer l'arbre
      # depuis les POM parents le fait interroger Maven Central des dizaines de
      # fois, se faire limiter en 429, et echouer pour une cause etrangere au
      # code. Verifie : depuis un pom.xml nu, l'extraction s'interrompt sur
      # « service unavailable » ; depuis le SBOM, elle rend un verdict en
      # quelques millisecondes.
      #
      # Java UNIQUEMENT. Le versant npm garde son propre dispositif, qui
      # distingue deja les dependances livrees au navigateur (bloquantes) de
      # l'outillage de developpement (informatif) — distinction qu'OSV ne fait
      # pas, et qui rendrait le garde rouge pour des failles jamais servies a un
      # utilisateur.
      - name: Construire le SBOM du back-end
        working-directory: backend
        run: >-
          ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          -DoutputFormat=json -DoutputName=bom

      - name: Scan de dependances (OSV — bloquant)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=backend/target/bom.json

      # Le SBOM est un livrable a part entiere : il repond a « que contenait
      # exactement cette version ? », question qu'on se pose le jour ou une CVE
      # sort, pas avant.
      - uses: actions/upload-artifact@v4
        with:
          name: zumm-sbom
          path: backend/target/bom.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Garde BLOQUANT, sur les dependances livrees au navigateur uniquement.
      # C'est celui qui compte : une faille dans react, react-dom ou qrcode part
      # chez l'utilisateur. Sans `--omit=dev`, l'etape ne pouvait pas bloquer —
      # d'ou le `continue-on-error` qui la rendait decorative.
      - name: Audit des dependances de production (bloquant)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Informatif : l'outillage de developpement (ESLint, Vitest) tire des
      # vulnerabilites transitives via brace-expansion/minimatch. Elles ne sont
      # jamais servies au navigateur, et leur correction exige ESLint 10, que
      # eslint-plugin-jsx-a11y ne supporte pas encore. Visible, non bloquant,
      # a rejuger quand le plugin aura suivi.
      - name: Audit des dependances de developpement (informatif)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      # Configuration d'infrastructure : Dockerfiles, docker-compose, manifestes.
      # C'est la couche que ni gitleaks ni les scanners de dependances ne lisent,
      # et celle ou se logent les fautes les plus couteuses — conteneur en root,
      # port de base publie, capacite superflue, image sans utilisateur dedie.
      # Epinglee sur un COMMIT, pas sur une etiquette : une etiquette se
      # repointe, et une action tierce qui s'execute dans le job de securite est
      # exactement l'endroit ou l'on ne veut pas d'un contenu mouvant. Le
      # numero de version reste en commentaire pour la lisibilite des mises a jour.
      - name: Scan de configuration d'infrastructure (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          # Ces repertoires ne contiennent aucune configuration executable :
          # dependances installees, rapports de couverture, artefacts de build et
          # livrables documentaires.
          skip-dirs: 'frontend/node_modules,frontend/coverage,backend/target,cahier de charge,roadmap'
          # Exemptions bornees a une regle, un chemin et une echeance.
          trivyignores: .trivyignore.yaml

      # ─── Vulnerabilites des IMAGES construites ───
      #
      # Ce que les etapes precedentes ne voient PAS. Le SBOM couvre les
      # dependances Java, npm audit celles du navigateur, `scan-type: config` la
      # facon dont les images sont ECRITES — aucun ne lit ce qu'elles CONTIENNENT
      # une fois construites : la distribution de base (`eclipse-temurin:17-jre-jammy`,
      # `nginx:alpine`), ses paquets systeme, ses bibliotheques natives. C'est
      # pourtant la couche que l'on redeploie sans y penser, et celle qui vieillit
      # toute seule : une image figee accumule les CVE de son OS sans qu'une seule
      # ligne du projet ne change.
      #
      # Les deux images se construisent en multi-etapes, donc sans artefact
      # prealable. Seule l'image FINALE est scannee : les etages de construction
      # (Maven, Node) ne sont pas deployes.
      - name: Construire les images à scanner
        run: |
          set -euo pipefail
          docker build -f infra/backend.Dockerfile -t zumm-backend:ci backend
          docker build -f infra/frontend.Dockerfile -t zumm-frontend:ci frontend

      - name: Scan de l'image back-end (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: zumm-backend:ci
          severity: HIGH,CRITICAL
          # Une vulnerabilite sans correctif disponible ne peut pas etre corrigee
          # ici : bloquer dessus rendrait la chaine rouge sans action possible, et
          # l'equipe finirait par neutraliser la porte. Elle reste VISIBLE dans le
          # rapport, elle ne bloque pas.
          ignore-unfixed: true
          # PAQUETS SYSTEME uniquement, et c'est le point de cette etape.
          #
          # Sans cette restriction, Trivy analyse aussi le JAR embarque et
          # telecharge pour cela sa base Java — un artefact d'environ un gigaoctet.
          # Deux raisons de s'en passer :
          #   * les dependances Java sont DEJA couvertes, et mieux, par le SBOM et
          #     OSV plus haut : ce serait la meme couverture payee deux fois ;
          #   * ce telechargement echoue. Constate en local : « failed to download
          #     Java DB: unexpected EOF ». Un garde qui depend d'un artefact
          #     d'un gigaoctet finit rouge pour une raison etrangere au code —
          #     exactement le travers corrige au SPRINT-12 sur Dependency-Check.
          #
          # Restreint aux paquets de la distribution, le scan couvre precisement ce
          # que rien d'autre ne lit, en quelques secondes.
          pkg-types: os
          exit-code: '1'
          trivyignores: .trivyignore.yaml

      - name: Scan de l'image front-end (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: zumm-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          pkg-types: os
          exit-code: '1'
          trivyignores: .trivyignore.yaml

      # Conformite des licences : une dependance AGPL contaminerait le livrable.
      - name: Détection de licences AGPL
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --silent
          npx --yes license-checker --summary --excludePrivatePackages > licences.txt || true
          cat licences.txt
          if grep -iE "AGPL" licences.txt; then
            echo "::error::Dépendance sous licence AGPL détectée."
            exit 1
          fi
