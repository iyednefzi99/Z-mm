name: CI applicative

# Ne touche pas build-pdfs.yml : les deux workflows sont independants.
on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'

env:
  JAVA_VERSION: '17'

jobs:
  backend:
    name: Backend — build et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Les tests d'integration ont besoin de cette image ; elle n'est pas
      # publiee sur un registre, donc la CI la construit comme un poste local.
      - name: Construire l'image PostgreSQL de test
        run: docker build -f infra/test-postgres.Dockerfile -t zumm/test-postgres:16 infra/

      - name: Tests unitaires et d'integration
        working-directory: backend
        run: ./mvnw -B verify

      # Un `BUILD SUCCESS` ne prouve rien si les tests d'integration ont ete
      # ignores faute de Docker : on le verifie explicitement.
      - name: Verifier que les tests d'integration ont bien tourne
        working-directory: backend
        run: |
          set -euo pipefail
          fichiers=$(ls target/failsafe-reports/*.txt 2>/dev/null || true)
          if [ -z "$fichiers" ]; then
            echo "::error::Aucun rapport failsafe : les tests d'integration n'ont pas tourne."
            exit 1
          fi
          if grep -qE "Skipped: [1-9]" $fichiers; then
            echo "::error::Des tests d'integration ont ete ignores."
            grep -E "Tests run" $fichiers
            exit 1
          fi
          grep -hE "Tests run" $fichiers

      - name: Empaqueter le JAR
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: zumm-jar
          path: backend/target/zumm.jar

  frontend:
    name: Frontend — lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        working-directory: frontend
        run: npm ci

      - name: Verification des types
        working-directory: frontend
        run: npm run typecheck

      # US-049 : le front n'avait ni lint ni test avant le SPRINT-10. Les deux
      # etapes precedent le build — un test rouge doit arreter la chaine avant
      # qu'un artefact ne soit produit.
      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Tests unitaires (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build de production
        working-directory: frontend
        run: npm run build

  securite:
    name: Sécurité — secrets, dépendances, licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Recherche de secrets versionnes : aucun secret ne doit entrer dans
      # l'historique, y compris dans un commit ancien.
      - name: Scan de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # ─── Vulnerabilites des dependances : DEUX gardes, et pourquoi ───
      #
      # OSV-Scanner est le garde BLOQUANT. Il interroge la base OSV, qui ne
      # demande aucune cle et couvre Maven comme npm. C'est ce qui le rend
      # utilisable : un garde qui echoue pour une raison etrangere au code
      # finit invariablement par etre contourne ou desactive.
      #
      # OWASP Dependency-Check reste, pour la profondeur de l'analyse NVD et la
      # correspondance CPE qu'OSV ne fait pas. Mais il depend de l'API du NIST,
      # qui limite severement les adresses partagees des runners GitHub : sans
      # cle, la mise a jour echoue en une minute et demie. Il n'est donc bloquant
      # QUE lorsque le secret NVD_API_KEY est configure — la cle est gratuite sur
      # nvd.nist.gov. Sans elle, l'etape reste visible et signale que le garde
      # profond est degrade, plutot que de peindre la chaine en rouge en
      # permanence pour une cause que le code ne peut pas corriger.
      - name: Scan de dependances (OSV — bloquant)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # Java UNIQUEMENT. Le versant npm garde son propre dispositif, qui
          # distingue deja les dependances livrees au navigateur (bloquantes) de
          # l'outillage de developpement (informatif) — distinction qu'OSV ne fait
          # pas, et qui rendrait le garde rouge pour des failles jamais servies a
          # un utilisateur.
          scan-args: |-
            --lockfile=backend/pom.xml

      # Le referentiel NVD est volumineux et lent a constituer : le cacher entre
      # deux executions evite de le retelecharger a chaque poussee.
      - name: Cache du referentiel NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: Scan de dependances (OWASP Dependency-Check, profond)
        working-directory: backend
        env:
          # Le secret passe par l'ENVIRONNEMENT, jamais par la ligne de commande :
          # une valeur en argument se retrouve dans la liste des processus.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "::warning title=Garde profond degrade::Secret NVD_API_KEY absent. Le referentiel NVD n'est pas joignable depuis un runner partage sans cle ; la cle est gratuite sur https://nvd.nist.gov/developers/request-an-api-key"
            ./mvnw -B org.owasp:dependency-check-maven:12.1.3:check               -DfailBuildOnCVSS=7               -DsuppressionFile=../.github/dependency-check-suppressions.xml               || echo "::warning::Analyse NVD non aboutie, faute de cle. Le garde bloquant reste OSV."
            exit 0
          fi
          ./mvnw -B org.owasp:dependency-check-maven:12.1.3:check             -DfailBuildOnCVSS=7             -DnvdApiKey="$NVD_API_KEY"             -DsuppressionFile=../.github/dependency-check-suppressions.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Garde BLOQUANT, sur les dependances livrees au navigateur uniquement.
      # C'est celui qui compte : une faille dans react, react-dom ou qrcode part
      # chez l'utilisateur. Sans `--omit=dev`, l'etape ne pouvait pas bloquer —
      # d'ou le `continue-on-error` qui la rendait decorative.
      - name: Audit des dependances de production (bloquant)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # Informatif : l'outillage de developpement (ESLint, Vitest) tire des
      # vulnerabilites transitives via brace-expansion/minimatch. Elles ne sont
      # jamais servies au navigateur, et leur correction exige ESLint 10, que
      # eslint-plugin-jsx-a11y ne supporte pas encore. Visible, non bloquant,
      # a rejuger quand le plugin aura suivi.
      - name: Audit des dependances de developpement (informatif)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      # Configuration d'infrastructure : Dockerfiles, docker-compose, manifestes.
      # C'est la couche que ni gitleaks ni les scanners de dependances ne lisent,
      # et celle ou se logent les fautes les plus couteuses — conteneur en root,
      # port de base publie, capacite superflue, image sans utilisateur dedie.
      # Epinglee sur un COMMIT, pas sur une etiquette : une etiquette se
      # repointe, et une action tierce qui s'execute dans le job de securite est
      # exactement l'endroit ou l'on ne veut pas d'un contenu mouvant. Le
      # numero de version reste en commentaire pour la lisibilite des mises a jour.
      - name: Scan de configuration d'infrastructure (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          # Ces repertoires ne contiennent aucune configuration executable :
          # dependances installees, rapports de couverture, artefacts de build et
          # livrables documentaires.
          skip-dirs: 'frontend/node_modules,frontend/coverage,backend/target,cahier de charge,roadmap'

      # Conformite des licences : une dependance AGPL contaminerait le livrable.
      - name: Détection de licences AGPL
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --silent
          npx --yes license-checker --summary --excludePrivatePackages > licences.txt || true
          cat licences.txt
          if grep -iE "AGPL" licences.txt; then
            echo "::error::Dépendance sous licence AGPL détectée."
            exit 1
          fi
