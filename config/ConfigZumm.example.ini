; ===========================================================================
; ConfigZumm.ini — configuration metier de Zümm
;
; Gabarit a copier en `ConfigZumm.ini` (non versionne). Le nom du fichier et
; les cles ne sont PAS traduits : ils sont identiques en francais, anglais et
; arabe. Seule la prose des commentaires peut l'etre.
;
; Le fichier est lu au demarrage et RELU A CHAUD des que sa date de modification
; change (US-025) : le modifier ne demande ni recompilation ni redemarrage. S'il
; est absent, l'application demarre sur les valeurs de repli de `SeuilsMetier`.
; Aucun secret ici : identifiants et mots de passe passent par l'environnement.
; ===========================================================================

[application]
; Langue source du produit ; en/ar en sont des traductions.
langue_par_defaut = fr
langues_actives = fr,en,ar

[seuils]
; Seuils metier demontres en revue de SPRINT-01.
; Les valeurs definitives proviennent du cahier des charges, pas de ce gabarit.
poids_ruche_alerte_kg = 15
temperature_min_celsius = 32
temperature_max_celsius = 36
humidite_max_pourcent = 70
; Niveau de batterie d'un capteur sous lequel une alerte s'ouvre (SPRINT-26).
; 20 % : ce qui laisse le temps d'une tournee, pas ce qui reste quand la
; balance s'est deja tue.
batterie_min_pourcent = 20
; Inclinaison au-dela de laquelle une ruche est signalee, en degres (SPRINT-31).
; Une ruche posee de travers sur un terrain en pente n'en est pas la ; au-dela,
; elle a bouge.
inclinaison_max_degres = 20
; Chute de poids qui declenche l'alarme anti-vol, entre deux mesures espacees de
; moins de deux heures (SPRINT-31). Plus qu'une hausse retiree a la main sans
; que rien ne soit enregistre, moins qu'une ruche emportee.
;
; L'alarme se TAIT si une recolte est enregistree ce jour-la sur la ruche : sans
; cette verification, la premiere miellee reveillerait tout le rucher.
chute_vol_kg = 10

[visites]
; Nombre de jours au-dela duquel une ruche est signalee comme non visitee.
delai_alerte_jours = 21

[carte]
; Precision d'affichage des positions pour les profils non proprietaires.
; La position exacte d'un rucher est une donnee sensible (risque de vol) :
; elle n'est jamais livree a un role non autorise (cf. US-003, RBAC).
arrondi_degres_public = 2
; Rayon de butinage par defaut, en kilometres (SPRINT-32). Chaque rucher peut le
; surcharger : deux ruchers d'une meme exploitation n'ont pas le meme terrain.
;
; 3 km, la distance ou une colonie fait l'essentiel de sa recolte. Elle va plus
; loin en terrain pauvre, mais le rendement d'un vol decroit vite : dessiner
; d'emblee dix kilometres ferait compter comme environnement des parcelles ou
; aucune abeille ne va deux fois.
rayon_butinage_km = 3

[listes]
; Nombre d'elements rendus par page sur les endpoints de liste (US-052).
; Le client peut demander une autre taille ; le serveur la plafonne a 200.
taille_page_defaut = 25

[economie]
; Hypotheses de valorisation du ROI de l'ecran de synthese (US-015).
;
; Ces deux valeurs etaient des constantes compilees dans SyntheseService, avec la
; mention « rejoindront ConfigZumm.ini lorsque le module recolte sera livre ». Il
; l'est depuis le SPRINT-07 : elles sont ici, et relues a chaud comme le reste.
;
; Elles varient d'une exploitation a l'autre et d'une annee a l'autre : un prix
; de vente en direct n'est pas un prix en gros. A renseigner par l'exploitant,
; sans quoi le ROI affiche n'est qu'un ordre de grandeur.
prix_miel_kg_eur = 12
cout_visite_eur = 25
