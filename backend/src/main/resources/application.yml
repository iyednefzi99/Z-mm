spring:
  application:
    name: zumm-backend
  datasource:
    # Le rôle APPLICATIF `zumm_app` — non-superutilisateur — est le défaut, en
    # local comme ailleurs. Un superutilisateur contourne toujours la RLS (V3,
    # ADR-001) : le laisser atteignable par simple oubli d'une variable
    # d'environnement offrirait un mode où l'isolation multi-tenant s'éteint
    # sans une ligne dans les journaux, et où tout `findById` traverse les
    # exploitations. Le défaut échoue donc FERMÉ : au pire un refus de droits
    # au démarrage, jamais une isolation silencieusement inerte.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zumm}
    username: ${SPRING_DATASOURCE_USERNAME:zumm_app}
    password: ${SPRING_DATASOURCE_PASSWORD:zumm_app_dev}
  jpa:
    # Flyway est seul proprietaire du schema : Hibernate ne le modifie jamais.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Flyway exige des droits DDL : il se connecte donc avec le PROPRIÉTAIRE
    # `zumm`, tandis que l'application tourne avec `zumm_app` (cf. `datasource`
    # ci-dessus). La séparation vaut PARTOUT — local, test, production — pour que
    # l'environnement de développement exerce la même isolation que la cible.
    #
    # `spring.flyway.url` reste volontairement absent : sans lui, Spring Boot
    # DÉRIVE la source de données de l'application et n'en remplace que les
    # identifiants. Les deux rôles visent donc toujours la même base, y compris
    # lorsque Testcontainers en fixe l'URL au démarrage. En production,
    # docker-compose.yml surcharge les trois variables SPRING_FLYWAY_*.
    user: ${SPRING_FLYWAY_USER:zumm}
    password: ${SPRING_FLYWAY_PASSWORD:zumm_secure}
    #
    # Placeholders du rôle applicatif créé par V3 (durcissement RLS, ADR-001).
    # Aucun secret versionné : DB_APP_PASSWORD alimente ce mot de passe et celui
    # de la source de données applicative en production.
    placeholders:
      role_app: ${DB_APP_USER:zumm_app}
      motdepasse_app: ${DB_APP_PASSWORD:zumm_app_dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emetteur des jetons. Keycloak expose ses cles publiques sous
          # <issuer-uri>/protocol/openid-connect/certs : aucun secret ici.
          issuer-uri: ${ZUMM_OIDC_ISSUER_URI:http://localhost:8081/realms/zumm}
      # ─── BFF (ADR-006) : le back-end est aussi CLIENT OAuth2 ───
      #
      # Les endpoints sont declares EXPLICITEMENT plutot que par `issuer-uri`.
      # Renseigner `issuer-uri` cote client declenche la decouverte OIDC AU
      # DEMARRAGE : l'application ne demarrerait plus sans Keycloak joignable —
      # ni en test, ni pendant un redemarrage du fournisseur. Le meme choix a deja
      # ete fait pour le serveur de ressources (cf. docker-compose.yml).
      #
      # Le secret n'est jamais versionne : il vient de l'environnement, et le
      # royaume de developpement en fixe un connu pour que la pile locale marche
      # sans reglage.
      client:
        provider:
          keycloak:
            authorization-uri: ${ZUMM_OIDC_ISSUER_URI:http://localhost:8081/realms/zumm}/protocol/openid-connect/auth
            token-uri: ${ZUMM_OIDC_ISSUER_URI:http://localhost:8081/realms/zumm}/protocol/openid-connect/token
            jwk-set-uri: ${ZUMM_OIDC_ISSUER_URI:http://localhost:8081/realms/zumm}/protocol/openid-connect/certs
            user-info-uri: ${ZUMM_OIDC_ISSUER_URI:http://localhost:8081/realms/zumm}/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: ${ZUMM_BFF_CLIENT:zumm-bff}
            client-secret: ${ZUMM_BFF_SECRET:secret-bff-dev}
            authorization-grant-type: authorization_code
            # Gabarit resolu a l'execution : Spring n'applique la valeur par
            # defaut qu'aux fournisseurs qu'il connait d'avance, pas a un
            # fournisseur declare a la main. Le laisser vide fait echouer le
            # demarrage sur « redirectUri cannot be empty ».
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
  # ─── Sessions serveur en base (SPRINT-17) ───
  # Le BFF a introduit une session cote serveur ; la garder en memoire
  # interdirait de repliquer le back-end et ferait perdre toutes les sessions a
  # chaque redemarrage. Le schema est cree par FLYWAY (V17) et non par Spring
  # Session : Flyway est seul proprietaire du schema (ddl-auto: none), et une
  # seconde autorite sur les tables reintroduirait exactement le desordre que
  # cette regle evite.
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
    timeout: 8h
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: fr
    locale-resolver: accept-header

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Actuator n'est jamais joignable depuis l'exterieur : le proxy inverse
        # ne laisse passer que /actuator/health (cf. infra/nginx/nginx.conf).
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: zumm
  observations:
    key-values:
      application: zumm

zumm:
  nom: Zumm
  version: 0.1.0-SNAPSHOT
  oidc:
    # Audience attendue dans le claim `aud` (SPRINT-12). Valider l'emetteur ne
    # suffit pas : Keycloak emet, pour un meme royaume, des jetons destines a
    # d'autres clients (dont `account`). Le royaume porte un `oidc-audience-mapper`
    # vers cette valeur ; les deux moities doivent rester synchronisees. Vider la
    # variable desactive la verification — repli d'incident, jamais un reglage.
    audience: ${ZUMM_OIDC_AUDIENCE:zumm-backend}
  openapi:
    # Contrat OpenAPI et Swagger UI accessibles sans jeton. Vrai par defaut (le
    # contrat est un livrable), FAUX sous le profil `prod` : voir SecurityConfig.
    public: ${ZUMM_OPENAPI_PUBLIC:true}
  bff:
    # Ou renvoyer le navigateur une fois la session Keycloak close. Sur la meme
    # origine que la PWA : le proxy inverse rassemble les deux.
    apres-deconnexion: ${ZUMM_BFF_APRES_DECONNEXION:/}
  # Microservice IA Python (US-035), joint par `ClientAnomalieIA`. VIDE par
  # defaut : `mvn test` et un demarrage local ne doivent dependre d'aucun service
  # externe, et `AnomalieService` retombe alors sur sa detection EWMA locale.
  # La pile docker-compose, elle, renseigne ZUMM_IA_URL sur le service interne.
  ia:
    url: ${ZUMM_IA_URL:}
  # Notifications e-mail des alertes (SPRINT-09, US-041). Désactivées par défaut :
  # aucune dépendance SMTP en local ni en test. En production, activer et fournir
  # spring.mail.* (host/port/credentials) via l'environnement.
  notifications:
    email:
      enabled: ${ZUMM_NOTIF_EMAIL_ENABLED:false}
      expediteur: ${ZUMM_NOTIF_EMAIL_FROM:alertes@zumm.local}
  # Le francais est la langue source ; en/ar en sont des traductions.
  langues-actives:
    - fr
    - en
    - ar

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.zumm: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

management:
  endpoint:
    health:
      show-details: never

zumm:
  openapi:
    # En production, la cartographie complete de l'API n'est plus anonyme : elle
    # reste lisible par un administrateur authentifie, et se distribue hors ligne
    # aux integrateurs tiers (US-026).
    public: false
